<section class="elastic-report">
  <style>
    .elastic-report { --elastic-blue:#0077cc; --elastic-green:#00bfb3; --elastic-yellow:#f8d448; --elastic-pink:#f04e98; --ink:#1f2937; --muted:#69707d; --line:#d3dae6; font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); line-height:1.45; max-width:1200px; }
    .elastic-card { border:1px solid var(--line); border-radius:18px; overflow:hidden; background:#fff; box-shadow:0 14px 34px rgba(31,41,55,.08); }
    .elastic-stripe { height:8px; background:linear-gradient(90deg,var(--elastic-green),var(--elastic-blue),var(--elastic-pink),var(--elastic-yellow)); }
    .elastic-body { padding:22px 24px 24px; }
    .eyebrow { color:var(--elastic-blue); font-size:.78rem; font-weight:700; letter-spacing:.08em; margin:0 0 6px; text-transform:uppercase; }
    h2 { font-size:1.45rem; margin:0 0 6px; }
    .subtitle,.muted { color:var(--muted); }
    table { border-collapse:collapse; margin-top:20px; width:100%; }
    th,td { border-bottom:1px solid #e6ebf2; padding:10px 8px; text-align:left; vertical-align:top; }
    th { color:var(--muted); font-size:.74rem; letter-spacing:.04em; text-transform:uppercase; }
    .metric { font-weight:800; }
    .value { font-weight:750; }
    .delta-pos { color:#00875a; font-weight:750; }
    .delta-neg { color:#bd271e; font-weight:750; }
    .delta-zero { color:var(--muted); }
    .experiment-link { color:var(--elastic-blue); font-weight:750; text-decoration:none; }
    .baseline { border-left:4px solid var(--elastic-green); padding-left:8px; }
    .small { color:var(--muted); font-size:.82rem; margin-top:3px; }
  </style>
  <div class="elastic-card">
    <div class="elastic-stripe"></div>
    <div class="elastic-body">
      <p class="eyebrow">Elastic · Opik · ZenML</p>
      <h2>Experiment comparison report</h2>
      <p class="subtitle">Static comparison across selected Opik evaluation result artifacts. Baseline: <strong>$baseline_label</strong>.</p>
      <table>
        <thead>$header_row</thead>
        <tbody>$metric_rows</tbody>
      </table>
      <p class="muted">Generated at $generated_at. Use Opik for per-item trace inspection; use ZenML for artifact history and run comparison.</p>
    </div>
  </div>
</section>
